<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="UI Flow Mapper">
  <defs>
    <pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M8 0H0V8" fill="none" stroke="#2557D6" stroke-opacity="0.18" stroke-width="0.8"/>
    </pattern>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2557D6"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="9" fill="#FFFFFF" stroke="#12161C" stroke-opacity="0.22"/>
  <rect x="5" y="5" width="54" height="54" rx="6" fill="url(#grid)"/>
  <!-- two screens and the jump between them -->
  <rect x="8" y="12" width="20" height="15" rx="1.5" fill="#E9ECF1" stroke="#12161C" stroke-opacity="0.35"/>
  <rect x="36" y="37" width="20" height="15" rx="1.5" fill="#E9ECF1" stroke="#12161C" stroke-opacity="0.35"/>
  <!-- navigate: solid ink, pen-down terminal, arrowhead -->
  <path d="M28 19.5 C 38 19.5, 26 44.5, 36 44.5" fill="none" stroke="#2557D6" stroke-width="2.4" marker-end="url(#tip)"/>
  <rect x="25" y="16.5" width="6" height="6" fill="#2557D6"/>
  <!-- overlay: dashed ink onto the paper -->
  <path d="M14 27 C 14 40, 22 52, 30 52" fill="none" stroke="#B25E00" stroke-width="2.2" stroke-dasharray="5 3"/>
  <rect x="30" y="45" width="16" height="11" fill="#B25E00" fill-opacity="0.12" stroke="#B25E00" stroke-width="1.4" stroke-dasharray="3 3"/>
  <rect x="27" y="49" width="6" height="6" fill="#FFFFFF" stroke="#B25E00" stroke-width="1.4"/>
</svg>
